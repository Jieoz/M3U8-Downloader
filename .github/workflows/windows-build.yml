name: windows-build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore "M3U8 Downloader.sln"

      - name: Build Release
        run: msbuild "M3U8 Downloader.sln" /p:Configuration=Release /p:Platform=x86 /p:TargetFrameworkVersion=v4.8 /v:m

      - name: Stage ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Tools | Out-Null
          $gz = "$env:RUNNER_TEMP/ffmpeg-win32-x64.gz"
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz" -OutFile $gz
          $raw = [System.IO.File]::ReadAllBytes($gz)
          $inputStream = New-Object System.IO.MemoryStream(,$raw)
          $gzip = New-Object System.IO.Compression.GzipStream($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
          $outPath = "dist/Tools/ffmpeg.exe"
          $output = [System.IO.File]::Create($outPath)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $inputStream.Dispose()
          if ((Get-Item $outPath).Length -lt 1000000) { throw "ffmpeg.exe is too small" }
          Copy-Item "M3U8 Downloader/bin/Release/M3U8 Downloader.exe" dist/
          Copy-Item "M3U8 Downloader/bin/Release/*.dll" dist/ -ErrorAction SilentlyContinue
          Copy-Item "M3U8 Downloader/bin/Release/*.config" dist/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: M3U8-Downloader-win-x86
          path: dist/
          if-no-files-found: error
